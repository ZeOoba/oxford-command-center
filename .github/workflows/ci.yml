name: CI

# Quality gate on every push/PR. Note: the $0 reconcile check (`npm run reconcile`) reads the
# canonical workbook (a local OneDrive file) and is LOCAL-ONLY — it cannot run in CI. CI runs
# typecheck + lint + tests + a production build + the bundle-size budget.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pinned (was '24'): Node 24.18.0 breaks pdf-parse@1.1.4's bundled pdf.js —
          # briefing-PDF tests fail with corrupt-buffer errors. 24.17.0 verified green
          # (bisected 2026-07-05, PR #161). Unpin only after pdf-parse is replaced.
          # Pinned (was '24'): Node >=24.18.0 raises Buffer.poolSize 8->64 KiB (nodejs/node#63597),
          # which trips a latent bug in pdf-parse v1's bundled pdf.js 1.10 on pooled buffers -
          # briefing tests fail with 'bad XRef entry'. 24.17.0 = security-only release WITHOUT the
          # poolSize change (keeps its CVE fixes). Unpin after pdf-parse is upgraded to v2.
          node-version: '24.17.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run gate:ci

  # Doctrine gate (architecture/coding-standards.md): a change to financial-decision source must
  # carry a `Refute-Reviewed:`/`Refute-Skip:` commit trailer attesting the refute-financial-change
  # adversarial pass ran. Separate job → shows as its own check; make it a REQUIRED check via branch
  # protection to hard-enforce (non-required by default). PR-only — it needs a base ref to diff.
  refute-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # Pinned (was '24'): Node 24.18.0 breaks pdf-parse@1.1.4's bundled pdf.js —
          # briefing-PDF tests fail with corrupt-buffer errors. 24.17.0 verified green
          # (bisected 2026-07-05, PR #161). Unpin only after pdf-parse is replaced.
          # Pinned (was '24'): Node >=24.18.0 raises Buffer.poolSize 8->64 KiB (nodejs/node#63597),
          # which trips a latent bug in pdf-parse v1's bundled pdf.js 1.10 on pooled buffers -
          # briefing tests fail with 'bad XRef entry'. 24.17.0 = security-only release WITHOUT the
          # poolSize change (keeps its CVE fixes). Unpin after pdf-parse is upgraded to v2.
          node-version: '24.17.0'
          cache: 'npm'
      - run: npm ci
      - run: git fetch --no-tags origin "${{ github.base_ref }}"
      - run: npm run check:refute -- --strict --base="origin/${{ github.base_ref }}"
