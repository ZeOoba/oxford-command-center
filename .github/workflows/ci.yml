name: CI

# Quality gate on every push/PR. Note: the full $0 reconcile check (`npm run reconcile`) reads the
# canonical workbook (a local OneDrive file) TWICE as an independent cross-check and is
# LOCAL-ONLY — it cannot run here (see full-gate-selfhosted.yml, which runs it but is
# workflow_dispatch only, never automatic on push/PR). `npm run reconcile:snapshot`
# (scripts/reconcile-snapshot.ts, added 2026-08-03 after the phantom-vacancy-lease incident —
# see PR #250 — shipped to the committed snapshot uncaught) IS wired in below: it runs
# checkSnapshot() against the COMMITTED data/snapshots/portfolio.json with zero workbook I/O, so
# it's a strict subset of the full check but runs on every PR here. CI runs typecheck + lint +
# tests + the snapshot reconciliation + a production build + the bundle-size budget.
on:
  push:
    branches: [main]
  pull_request:

# RUNNER TOGGLE (2026-09-28): both required jobs run on GitHub-hosted ubuntu-latest by default.
# Setting the repo variable CI_RUNNER=self moves them to the self-hosted runner on Gabriel's
# Windows laptop (labels: self-hosted, windows, ora-ci) — no billed Actions minutes. Added when
# account billing stopped hosted jobs from starting. Job ids `gate` / `refute-required` are the
# branch-protection required-check names: never rename them. While CI_RUNNER=self, CI only runs
# while that laptop is on and the runner service is up; unset the variable to fall back.
#   gh variable set CI_RUNNER --body self --repo ZeOoba/oxford-command-center
#   gh variable delete CI_RUNNER --repo ZeOoba/oxford-command-center
jobs:
  gate:
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","windows","ora-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run gate:ci

  # Doctrine gate (architecture/coding-standards.md): every commit that changes financial-decision
  # source must carry its OWN `Refute-Reviewed:`/`Refute-Skip:` trailer attesting the
  # refute-financial-change adversarial pass ran (per commit, not per range — 2026-09-23). Separate job → shows as its own check; make it a REQUIRED check via branch
  # protection to hard-enforce (non-required by default). PR-only — it needs a base ref to diff.
  refute-required:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","windows","ora-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: git fetch --no-tags origin "${{ github.base_ref }}"
      # --head = the PR head sha, not the synthetic refs/pull/N/merge HEAD: attestation is per commit,
      # and that merge is built server-side by GitHub, so a local re-merge that disagrees with it would
      # flag a commit nobody can reword.
      - run: npm run check:refute -- --strict --base="origin/${{ github.base_ref }}" --head="${{ github.event.pull_request.head.sha }}"
