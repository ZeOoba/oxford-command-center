<script>

var TAB=[["overview","Overview"],["explorer","Property explorer"],["properties","Scorecard table"],["levers","Rent & NOI levers"],["watch","Expense watchlist"],["evaluate","Evaluation scorecard"],["data","Command center data"]];
function $(s,r){return (r||document).querySelector(s)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function usd(x,d){if(x==null||isNaN(x))return '–';var a=Math.abs(x),s=x<0?'-':'';if(d==='k')return s+'$'+(a/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'K';if(a>=1e6&&d!=='f')return s+'$'+(a/1e6).toFixed(2)+'M';return s+'$'+Math.round(a).toLocaleString('en-US')}
function pc(x,d){if(x==null||isNaN(x))return '–';return (x>0?'+':'')+(x*100).toFixed(d==null?1:d)+'%'}
function pl(x,d){if(x==null||isNaN(x))return '–';return (x*100).toFixed(d==null?0:d)+'%'}
function cls(x,inv){if(x==null||Math.abs(x)<0.0005)return 'mut';var g=inv?x<0:x>0;return g?'pos':'neg'}
function P(p,per){var o=D.props[p];return o&&o.periods[per]}
function sumP(list,per,key){return list.reduce(function(a,p){var m=P(p,per);return a+((m&&m[key])||0)},0)}
function oxby(list,per,c){return list.reduce(function(a,p){var m=P(p,per);return a+((m&&m.opex_by&&m.opex_by[c])||0)},0)}
function g(a,b){return a?b/a-1:null}

/* ---------- tabs ---------- */
var tabs=$('#tabs');
TAB.forEach(function(t){var b=el('button',null,t[1]);b.setAttribute('role','tab');b.dataset.t=t[0];b.onclick=function(){show(t[0])};tabs.appendChild(b)});
function show(id){
  TAB.forEach(function(t){var on=t[0]===id;$('#t-'+t[0]).classList.toggle('on',on);$('[data-t="'+t[0]+'"]').setAttribute('aria-selected',on)});

}

(function(){

  var oxNoTaxA=ytd.opex.prior-ytd.opex_by['Real estate & property tax'].prior, oxNoTaxB=ytd.opex.current-ytd.opex_by['Real estate & property tax'].current;
  var high=D.insights.filter(function(i){return i.severity==='High'}).length;
  var lede='Rent is growing about 3% on a same-store basis, while operating cost excluding real estate tax is up about 7%. The biggest dollars sit in three places: FVC rent, the Livingston re-lease, and utilities at Broadway and FVC.';
  s.innerHTML='<p class="lede">'+lede+'</p>';
  var k=el('div','kpis');

  k.innerHTML=kp('Base rent, Jan-Sep 2026',usd(ytd.base_rent.current),'<span class="'+cls(ytd.base_rent.pct)+'">'+pc(ytd.base_rent.pct)+'</span> vs Jan-Sep 2025, six same-store assets')
   +kp('Opex excl. RE tax, Jan-Sep',usd(oxNoTaxB),'<span class="'+cls(g(oxNoTaxA,oxNoTaxB),true)+'">'+pc(g(oxNoTaxA,oxNoTaxB))+'</span> vs 2025 (tax is cash-timing)')

  s.appendChild(k);
  var g2=el('div','grid2');
  var left=el('div','panel',"<h3>Same-store base rent vs operating cost</h3><div class='sub'>Monthly, 3-month trailing average. Six assets with full history. Operating cost excludes real estate tax, which is paid in lumps.</div><div class='chart' id='ch1'></div><div class='legend'><span><i style='background:var(--s1)'></i>Base rent</span><span><i style='background:var(--s2)'></i>Opex excl. real estate tax</span></div>");
  var right=el('div','panel',"<h3>What moved, Jan-Sep 2026 vs 2025</h3><div class='sub'>Change in dollars by cost category, same-store.</div><div class='chart' id='ch2'></div>");
  g2.appendChild(left);g2.appendChild(right);s.appendChild(g2);
  var top=el('div','sec','<h2>Where the money is</h2><div class="note" style="margin-bottom:6px">Ranked by estimated annual swing. Sizes are estimates or sensitivities; the basis is stated on each item in the Expense watchlist and Rent &amp; NOI levers tabs.</div>');
  D.insights.filter(function(i){return i.severity==='High'}).sort(function(a,b){return Math.abs(b.annual_impact_usd||0)-Math.abs(a.annual_impact_usd||0)}).forEach(function(i){

function monthsList(){var o=[];for(var y=2024;y<=2026;y++)for(var m=1;m<=12;m++){if(y===2026&&m>9)break;o.push(y+'-'+(m<10?'0':'')+m)}return o}
function drawLine(host){
  if(!host)return;host.innerHTML='';
  var ms=monthsList(),W=host.clientWidth||600,H=280,ml=44,mr=12,mt=10,mb=26;
  function ser(fn){var raw=ms.map(function(m){return SS.reduce(function(a,p){var c=D.cube[p][m];return a+(c?fn(c):0)},0)});return raw.map(function(v,i){if(i<2)return null;return (raw[i]+raw[i-1]+raw[i-2])/3})}
  var a=ser(function(c){return c.base_rent}),b=ser(function(c){return c.opex-c.opex_by['Real estate & property tax']});
  var all=a.concat(b).filter(function(x){return x!=null});var mx=Math.ceil(Math.max.apply(null,all)/50000)*50000,mn=0;
  var x=function(i){return ml+(W-ml-mr)*i/(ms.length-1)},y=function(v){return mt+(H-mt-mb)*(1-(v-mn)/(mx-mn))};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly same-store base rent and operating cost excluding real estate tax, 3-month trailing average">';
  for(var t=0;t<=4;t++){var v=mn+(mx-mn)*t/4;s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/><text x="'+(ml-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+usd(v,'k').replace('.0K','K')+'</text>'}
  ms.forEach(function(m,i){if(m.slice(5)==='01'||m.slice(5)==='07'){s+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+(m.slice(5)==='01'?m.slice(0,4):'Jul')+'</text>'}});
  function path(vals,col){var d='',on=false;vals.forEach(function(v,i){if(v==null)return;d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);on=true});return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'}
  s+=path(a,'var(--s1)')+path(b,'var(--s2)');
  var li=ms.length-1;s+='<circle cx="'+x(li)+'" cy="'+y(a[li])+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><circle cx="'+x(li)+'" cy="'+y(b[li])+'" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>';
  s+='<line id="xh" x1="0" x2="0" y1="'+mt+'" y2="'+(H-mb)+'" stroke="var(--axis)" style="display:none"/><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'" fill="transparent" id="hit"/></svg>';
  host.innerHTML=s+'<div class="tip" style="display:none"></div>';
  var hit=$('#hit',host),xh=$('#xh',host),tip=$('.tip',host);
  hit.addEventListener('mousemove',mv);hit.addEventListener('touchmove',function(e){mv(e.touches[0])},{passive:true});
  hit.addEventListener('mouseleave',function(){xh.style.display='none';tip.style.display='none'});
  function mv(e){var r=host.getBoundingClientRect(),px=e.clientX-r.left;var i=Math.round((px-ml)/(W-ml-mr)*(ms.length-1));i=Math.max(2,Math.min(ms.length-1,i));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';
    tip.innerHTML='<b>'+ms[i]+'</b><br>Base rent '+usd(a[i],'f')+'/mo<br>Opex excl. tax '+usd(b[i],'f')+'/mo';tip.style.display='';
    var l=x(i)+12;if(l+170>W)l=x(i)-172;tip.style.left=l+'px';tip.style.top='8px'}
}
function drawBars(host,ytd){
  if(!host)return;host.innerHTML='';
  var items=OPC.map(function(c){var o=ytd.opex_by[c];return {c:c,d:o.current-o.prior,p:o.pct}}).sort(function(a,b){return b.d-a.d});
  var W=host.clientWidth||400,rh=30,H=items.length*rh+22,ml=Math.min(150,W*.4),mr=64;
  var mx=Math.max.apply(null,items.map(function(i){return Math.abs(i.d)})),zero=ml+(W-ml-mr)*(Math.min.apply(null,items.map(function(i){return i.d}))<0?0.3:0);
  var span=(W-mr-zero),negspan=zero-ml;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Change in operating cost by category, January to September 2026 versus 2025">';
  items.forEach(function(it,i){var y=i*rh+6,w=Math.abs(it.d)/mx*(it.d>=0?span:negspan);var x0=it.d>=0?zero:zero-w;
    s+='<text x="'+(ml-8)+'" y="'+(y+13)+'" text-anchor="end" style="fill:var(--ink2);font-family:var(--f-body);font-size:12px">'+esc(it.c.replace(' & property tax',' tax').replace('Grounds / snow / lot','Grounds & snow').replace('Repairs & maintenance','Repairs & maint.'))+'</text>';
    s+='<rect x="'+x0+'" y="'+y+'" width="'+Math.max(w,1)+'" height="16" fill="'+(it.d>=0?'var(--s2)':'var(--s1)')+'" rx="0"/>';
    s+='<text x="'+(it.d>=0?x0+w+6:zero+6)+'" y="'+(y+12)+'" text-anchor="start" style="fill:var(--ink);font-size:11px">'+(it.d>=0?'+':'-')+usd(Math.abs(it.d),'k').replace('.0K','K')+'</text>'});
  s+='<line x1="'+zero+'" x2="'+zero+'" y1="0" y2="'+(H-16)+'" stroke="var(--axis)"/><text x="'+zero+'" y="'+(H-3)+'" text-anchor="middle">0</text></svg>';
  host.innerHTML=s+'<div class="legend"><span><i style="background:var(--s2)"></i>Cost up</span><span><i style="background:var(--s1)"></i>Cost down</span></div><div class="note" style="margin-top:6px">Real estate tax is down mostly because second-half installments are not yet paid (cash basis). Utilities and repairs are the real increases.</div>';
}

        if(!dl.length)w+='<div class="note">No account moved by more than $1,317.</div>';
        dl.slice(0,12).forEach(function(d){var good=d.lt==='rev'?d.d>0:d.d<0;
          w+='<div class="drv"><div class="dh"><span class="pill '+(good?'Low':'High')+'" style="color:'+(good?'var(--good-ink)':'var(--crit-ink)')+'">'+(good?'Helps NOI':'Hurts NOI')+'</span><b>'+esc(d.a)+'</b><span class="mut">'+esc(d.c)+' · '+(d.lt==='rev'?'revenue':'expense')+'</span></div><div class="dn">'+usd(d.p,'f')+' → '+usd(d.n,'f')+' <b class="'+(good?'pos':'neg')+'">'+(d.d>0?'+':'-')+usd(Math.abs(d.d),'f')+(d.pct==null?'':' ('+pc(d.pct)+')')+'</b></div><p>'+esc(natText(d,e))+'</p></div>'});
        $('#why').innerHTML=w;tipifyBars($('#why'));
      }
      pk.onchange=why;why();
    }
    /* rent events */
    var evs=(e.ev||[]).filter(function(v){return Math.abs(v.b-v.a)>=1000}).slice(-8).reverse();
    var eh='<div class="panel" style="margin-top:28px"><h3>Rent changes visible in the statements</h3><div class="sub">Net change in monthly base rent that persisted for at least three months. At multi-tenant assets each step nets lease starts, expirations and escalations.</div>';
    if(evs.length){eh+='<div class="tbl"><table><thead><tr><th>Month</th><th>Monthly rent before</th><th>Monthly rent after</th><th>Change</th><th>Annualized</th></tr></thead><tbody>'+evs.map(function(v){return '<tr><td>'+mlab(v.m)+'</td><td>'+usd(v.a,'f')+'</td><td>'+usd(v.b,'f')+'</td><td class="'+cls(v.pct)+'">'+pc(v.pct)+'</td><td class="'+cls(v.pct)+'">'+(v.b>v.a?'+':'-')+usd(Math.abs(v.b-v.a)*12,'f')+'</td></tr>'}).join('')+'</tbody></table></div>'}
    else eh+='<div class="note">'+(e.monthly?'No persistent step of $608 a month or more was detected.':'Annual statements only: see the year-over-year table for the rent change.')+'</div>';
    $('#evb').innerHTML=eh+'</div>';
    var lc=$('#lsc');if(lc){var L=D.leases.filter(function(l){return l.property.indexOf(LKEY[p])===0})[0];stepChart(lc,L,p)}
    /* insights */
    $('#ins').innerHTML=insightsFor(p).map(function(i){return '<div class="ins"><b>'+esc(i.h)+'</b><span>'+esc(i.t)+'</span></div>'}).join('');
    var pi=D.insights.filter(function(i){return i.property.indexOf(p.split(' (')[0])===0});
    var pn=$('#pi');if(pi.length)pi.forEach(function(i){pn.appendChild(item(i))});else pn.innerHTML='<div class="note">No open items for this property in the portfolio review.</div>';
  }
  function tipifyBars(host){
    var tip=host.querySelector('.tip');if(!tip){tip=el('div','tip');tip.style.display='none';host.style.position='relative';host.appendChild(tip)}
    host.onmousemove=function(e){var t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}var parts=t.getAttribute('data-tip').split('\n');tip.innerHTML='<b>'+esc(parts[0])+'</b>'+parts.slice(1).map(function(x){return '<br>'+esc(x)}).join('');tip.style.display='';var r=host.getBoundingClientRect(),l=e.clientX-r.left+14;if(l+tip.offsetWidth>r.width)l=e.clientX-r.left-tip.offsetWidth-14;tip.style.left=Math.max(0,l)+'px';tip.style.top=(e.clientY-r.top-10)+'px'};
    host.onmouseleave=function(){tip.style.display='none'};
  }
  window.openExplorer=function(p){sel=p;show('explorer');render()};
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(s.classList.contains('on'))render()},250)});
  render();
})();

var start=(location.hash||'').replace('#','');if(!TAB.some(function(t){return t[0]===start}))start='overview';show(start);window.scrollTo(0,0);
})();
</script>
